<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KhataPro Admin Panel</title>
<style>*{box-sizing:border-box}body{margin:0;background:#06101c;color:#eef7ff;font-family:Arial,system-ui,sans-serif}header{padding:18px 20px;background:#0b1b2c;border-bottom:1px solid #29435c;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.brand{font-size:23px;font-weight:900}main{max-width:1200px;margin:auto;padding:22px}.panel{background:#0d2034;border:1px solid #29435c;border-radius:18px;padding:20px;margin:16px 0}.btn{border:0;border-radius:10px;padding:12px 16px;background:#188ee0;color:#fff;font-weight:800;cursor:pointer}.btn.secondary{background:#263d52}.muted{color:#9db2c7}.hidden{display:none!important}input{padding:12px;border-radius:10px;border:1px solid #34516b;background:#061522;color:white;width:100%;margin:8px 0}.login{max-width:430px;margin:10vh auto}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{padding:16px;background:#071725;border:1px solid #29435c;border-radius:12px}.stat strong{font-size:25px;display:block;margin-top:7px}.customer{padding:18px;border:1px solid #29435c;background:#0a1a2a;border-radius:16px;margin:12px 0;overflow-wrap:anywhere}.person{display:flex;gap:12px;align-items:center}.person img{width:58px;height:58px;object-fit:cover;border-radius:50%;background:#172d40}.person h3{margin:0 0 5px}.details{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:15px}.item{background:#ffffff08;border-radius:9px;padding:10px;font-size:14px}.item b{display:block;color:#9db2c7;font-size:11px;text-transform:uppercase;margin-bottom:5px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.error{color:#ff9b9b;white-space:pre-wrap}.toprow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.toprow input{max-width:420px;margin:0}@media(max-width:650px){main{padding:12px}.stats{grid-template-columns:1fr}.details{grid-template-columns:1fr}.panel{padding:15px}}</style></head><body>
<header><div class="brand">🛡️ KhataPro Admin</div><div><span id="adminEmail" class="muted"></span> <button id="logoutBtn" class="btn secondary hidden">Logout</button></div></header>
<main><section id="loginPanel" class="panel login"><h1>Admin Login</h1><p class="muted">Only authorized administrator can open this panel.</p><button id="loginBtn" class="btn">Continue with Google</button><p id="loginError" class="error"></p></section>
<section id="dashboard" class="hidden"><div class="panel"><h1>Customer Records</h1><p class="muted">Customer profiles and activity saved in Firebase Realtime Database.</p><div class="stats"><div class="stat">Total customers<strong id="totalCustomers">0</strong></div><div class="stat">Windows download clicks<strong id="totalWindows">0</strong></div><div class="stat">Customer App clicks<strong id="totalApps">0</strong></div></div></div>
<div class="panel"><div class="toprow"><input id="searchBox" placeholder="Search name, Gmail, WhatsApp…"><button id="refreshBtn" class="btn secondary">Refresh</button></div><p id="status" class="muted">Loading records…</p><div id="customerList"></div></div></section></main>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js';
import {getAuth,GoogleAuthProvider,signInWithPopup,signInWithRedirect,getRedirectResult,onAuthStateChanged,signOut} from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js';
import {getDatabase,ref,onValue,get} from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js';
const firebaseConfig={apiKey:'AIzaSyA0C8ZAlYUZQM4UYs49xBhyMHwArJDLpA',authDomain:'website-a091e.firebaseapp.com',databaseURL:'https://website-a091e-default-rtdb.firebaseio.com',projectId:'website-a091e',storageBucket:'website-a091e.firebasestorage.app',messagingSenderId:'204226900375',appId:'1:204226900375:web:2edc07a4db0a90fa4b14d2',measurementId:'G-WNSLPLBJB2'};
const ADMIN='joshibasu12345@gmail.com',app=initializeApp(firebaseConfig),auth=getAuth(app),db=getDatabase(app),provider=new GoogleAuthProvider();provider.setCustomParameters({prompt:'select_account'});const $=id=>document.getElementById(id);let all={},stopListen=null;
const fmt=v=>{if(!v)return '—';const d=new Date(v);return Number.isNaN(d.getTime())?String(v):d.toLocaleString()};
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function showLogin(msg=''){$('loginPanel').classList.remove('hidden');$('dashboard').classList.add('hidden');$('logoutBtn').classList.add('hidden');$('adminEmail').textContent='';$('loginError').textContent=msg;}
function render(){const q=$('searchBox').value.trim().toLowerCase();const entries=Object.entries(all).filter(([uid,c])=>[c.name,c.email,c.whatsapp,c.address].some(v=>String(v||'').toLowerCase().includes(q))).sort((a,b)=>(b[1].lastLoginAt||0)-(a[1].lastLoginAt||0));$('totalCustomers').textContent=Object.keys(all).length;$('totalWindows').textContent=Object.values(all).reduce((n,c)=>n+(c.downloads?.windowsSoftwareDownload?.count||0),0);$('totalApps').textContent=Object.values(all).reduce((n,c)=>n+(c.downloads?.customerPortalAppDownload?.count||0),0);$('status').textContent=`Showing ${entries.length} of ${Object.keys(all).length} customers`;
$('customerList').innerHTML=entries.map(([uid,c])=>{const d=c.downloads||{};return `<article class="customer"><div class="person"><img src="${esc(c.photoURL||'https://www.gravatar.com/avatar/?d=mp')}" alt="Google profile photo"><div><h3>${esc(c.name||'Unnamed customer')}</h3><div>${esc(c.email||'No Gmail')}</div><div class="muted">UID: ${esc(uid)}</div></div></div><div class="details">
<div class="item"><b>WhatsApp</b>${esc(c.whatsapp||'—')}</div><div class="item"><b>Address</b>${esc(c.address||'—')}</div><div class="item"><b>Purpose</b>${esc(c.purpose||'—')}</div><div class="item"><b>Login provider</b>${esc(c.provider||'—')}</div><div class="item"><b>First login</b>${esc(fmt(c.firstLoginAt))}</div><div class="item"><b>Last login</b>${esc(fmt(c.lastLoginAt))}</div><div class="item"><b>Details submitted</b>${esc(fmt(c.profileSubmittedAt))}</div><div class="item"><b>Last activity / action</b>${esc(fmt(c.lastActivityAt))} · ${esc(c.lastAction||'—')}</div><div class="item"><b>Login count</b>${esc(c.loginCount||0)}</div><div class="item"><b>Windows software download clicks</b>${esc(d.windowsSoftwareDownload?.count||0)} · Last: ${esc(fmt(d.windowsSoftwareDownload?.lastClickedAt))}</div><div class="item"><b>Web version opens</b>${esc(d.webVersionOpen?.count||0)} · Last: ${esc(fmt(d.webVersionOpen?.lastClickedAt))}</div><div class="item"><b>Customer app download clicks</b>${esc(d.customerPortalAppDownload?.count||0)} · Last: ${esc(fmt(d.customerPortalAppDownload?.lastClickedAt))}</div></div><div class="actions"><button class="btn secondary" data-copy="${esc(c.email||'')}">Copy Gmail</button><button class="btn secondary" data-copy="${esc(c.whatsapp||'')}">Copy WhatsApp</button></div></article>`}).join('')||'<p class="muted">No customer records found.</p>';}
$('loginBtn').addEventListener('click',async()=>{try{await signInWithPopup(auth,provider)}catch(e){if(['auth/popup-blocked','auth/operation-not-supported-in-this-environment'].includes(e.code)){try{await signInWithRedirect(auth,provider)}catch(x){$('loginError').textContent=x.message}}else $('loginError').textContent=e.message+'\nEnable Google provider in Firebase Authentication.'}});
$('logoutBtn').addEventListener('click',()=>signOut(auth));$('refreshBtn').addEventListener('click',async()=>{try{const s=await get(ref(db,'customers'));all=s.exists()?s.val():{};render()}catch(e){$('status').textContent='Read error: '+e.message}});$('searchBox').addEventListener('input',render);$('customerList').addEventListener('click',async e=>{const b=e.target.closest('[data-copy]');if(b){try{await navigator.clipboard.writeText(b.dataset.copy);b.textContent='Copied!'}catch{alert(b.dataset.copy)}}});
onAuthStateChanged(auth,async user=>{if(stopListen){stopListen();stopListen=null}if(!user){all={};showLogin();return}if((user.email||'').toLowerCase()!==ADMIN){await signOut(auth);showLogin('Access denied. Only '+ADMIN+' can access Admin Panel.');return}$('loginPanel').classList.add('hidden');$('dashboard').classList.remove('hidden');$('logoutBtn').classList.remove('hidden');$('adminEmail').textContent=user.email;stopListen=onValue(ref(db,'customers'),snap=>{all=snap.exists()?snap.val():{};render()},err=>{$('status').textContent='Database error: '+err.message+' Check Realtime Database Rules.'});});getRedirectResult(auth).catch(e=>$('loginError').textContent=e.message);
</script></body></html>
